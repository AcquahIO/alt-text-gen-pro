<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 1.02fr .98fr;
      align-items: center;
      padding: 58px 64px;
      color: #fff;
      background:
        radial-gradient(circle at 80% 18%, rgba(52, 127, 255, .34), transparent 31%),
        radial-gradient(circle at 30% 105%, rgba(22, 99, 235, .28), transparent 38%),
        linear-gradient(135deg, #071733 0%, #0b285c 55%, #07142f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .08;
      background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(90deg, transparent, black);
    }
    .copy, .visual { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 17px; margin-bottom: 44px; }
    .brand img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,.28); }
    .brand strong { display: block; font-size: 28px; letter-spacing: -.7px; }
    .brand span { display: block; margin-top: 5px; color: #a9c7f4; font-size: 16px; }
    h1 { max-width: 600px; margin: 0; font-size: 65px; line-height: .98; letter-spacing: -4.2px; }
    p { max-width: 510px; margin: 27px 0 0; color: #c6d8f4; font-size: 24px; line-height: 1.42; }
    .pills { display: flex; gap: 11px; margin-top: 34px; }
    .pills span { padding: 10px 14px; border: 1px solid rgba(157,194,250,.34); border-radius: 999px; color: #d7e6fb; background: rgba(255,255,255,.06); font-size: 15px; font-weight: 700; }
    .visual { display: grid; place-items: center; }
    .halo { position: absolute; width: 490px; height: 490px; border-radius: 50%; background: rgba(49,123,246,.15); filter: blur(3px); }
    .window {
      position: relative;
      width: 520px;
      padding: 18px;
      border: 1px solid rgba(175,207,255,.32);
      border-radius: 30px;
      background: rgba(245,249,255,.96);
      box-shadow: 0 35px 80px rgba(0,0,0,.34);
      transform: rotate(2deg);
    }
    .chrome { display: flex; gap: 8px; align-items: center; height: 31px; padding: 0 9px 12px; }
    .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #fd645d; }
    .chrome i:nth-child(2) { background: #f6be43; }
    .chrome i:nth-child(3) { background: #4bc96b; }
    .window > img { display: block; width: 100%; border-radius: 17px; border: 1px solid #d5dfed; }
    .spark { position: absolute; right: -24px; top: -25px; display: grid; place-items: center; width: 74px; height: 74px; border-radius: 22px; background: #1465e8; color: white; font-size: 38px; box-shadow: 0 17px 40px rgba(8,70,177,.45); }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand">
      <img src="../icons/icon-512.png" alt="" />
      <div><strong>Alt Text Generator Pro</strong><span>Accurate alt text, in your workflow</span></div>
    </div>
    <h1>Alt text, without leaving the page.</h1>
    <p>Generate, review, and copy SEO-aware image descriptions in Chrome—or connect a separately metered agent workflow.</p>
    <div class="pills"><span>Chrome extension</span><span>API + MCP</span><span>Accuracy first</span></div>
  </section>
  <section class="visual">
    <div class="halo"></div>
    <div class="window">
      <div class="chrome"><i></i><i></i><i></i></div>
      <img src="../apps/web/public/assets/extension-popup-command.png" alt="" />
      <div class="spark">✦</div>
    </div>
  </section>
</body>
</html>
