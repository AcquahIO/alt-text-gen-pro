<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alt Text Generator Pro — Chrome Store artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #10204b; color: #fff; }
    .art { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 56% 44%; }
    .copy { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: 8.5% 9%; background: #10204b; }
    .brand { display: flex; align-items: center; gap: .7em; font-weight: 750; font-size: clamp(11px, 2.4vw, 30px); }
    .mark { display: grid; place-items: center; width: 2.15em; height: 2.15em; border-radius: .58em; background: #fff; color: #10204b; font-size: .65em; }
    h1 { max-width: 8.8em; margin: 0; font-size: clamp(27px, 5.4vw, 74px); line-height: .95; letter-spacing: -.055em; }
    .tag { margin: 0; color: #b9caff; font-size: clamp(9px, 1.65vw, 21px); font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .visual { position: relative; overflow: hidden; background: #e7dfd2; }
    .visual img { width: 100%; height: 100%; object-fit: cover; object-position: 57% center; }
    .badge { position: absolute; right: 7%; bottom: 9%; max-width: 72%; padding: 4% 5%; border: 1px solid rgba(255,255,255,.55); border-radius: 12px; background: rgba(9,16,35,.82); color: #fff; font-size: clamp(7px, 1.1vw, 15px); font-weight: 700; line-height: 1.35; }
    @media (max-aspect-ratio: 2/1) {
      .copy { padding: 9% 8%; }
      .brand { align-items: flex-start; line-height: 1.05; }
      h1 { max-width: 7.2em; }
      .badge { display: none; }
    }
  </style>
</head>
<body>
  <main class="art">
    <section class="copy">
      <div class="brand"><span class="mark">AT</span><span>Alt Text Generator Pro</span></div>
      <h1>Alt text that works harder for search.</h1>
      <p class="tag">SEO-aware · Accuracy-first</p>
    </section>
    <section class="visual">
      <img src="/apps/web/public/assets/seo-alt-text-hero.jpg" alt="" />
      <div class="badge">Light oak dining chair with curved backrest in a warm studio setting</div>
    </section>
  </main>
</body>
</html>
